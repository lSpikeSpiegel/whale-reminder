[package]
name = "whale-reminder"
version = "0.3.0"
description = "鲸鱼娘桌宠待办提醒"
authors = ["you"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "whale_reminder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 呼出面板的全局热键。只用到 Rust 侧 API，前端没有 JS 调用，所以 capabilities 不用加
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"

# 扫码助手：截屏 + 识别
# xcap 抓屏（Windows 走 GDI/DXGI，返回物理像素的 RgbaImage），
# rxing 是 ZXing 的 Rust 移植：decoders 认码、encoders 出码，一次覆盖二维码和一维码。
# 关掉 rxing 的 image feature：它把 image 钉死在 =0.25.8，
# 会和 xcap 用的 0.25.x 各编一份；我们自己把像素喂给它就够了。
# encoding_rs 不能省：CharacterSet 的编解码方法挂在这个 feature 上，
# 只开 decoders 会编不过。
xcap = "0.9"
rxing = { version = "0.9", default-features = false, features = [
    "decoders",
    "encoders",
    "full_barcode_format_support",
    "encoding_rs",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# MCP server（--mcp 模式）。default 已含 server + macros，只需补 stdio transport。
rmcp = { version = "3.9", features = ["transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
