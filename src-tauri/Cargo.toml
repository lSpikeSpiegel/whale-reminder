[package]
name = "whale-reminder"
version = "0.7.0"
description = "鲸鱼娘桌宠待办提醒"
authors = ["you"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "whale_reminder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 呼出面板的全局热键。只用到 Rust 侧 API，前端没有 JS 调用，所以 capabilities 不用加
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"

# 扫码助手：截屏 + 识别
# xcap 抓屏（Windows 走 GDI/DXGI，返回物理像素的 RgbaImage），
# rxing 是 ZXing 的 Rust 移植：decoders 认码、encoders 出码，一次覆盖二维码和一维码。
# 关掉 rxing 的 image feature：它把 image 钉死在 =0.25.8，
# 会和 xcap 用的 0.25.x 各编一份；我们自己把像素喂给它就够了。
# encoding_rs 不能省：CharacterSet 的编解码方法挂在这个 feature 上，
# 只开 decoders 会编不过。
xcap = "0.9"
rxing = { version = "0.9", default-features = false, features = [
    "decoders",
    "encoders",
    "full_barcode_format_support",
    "encoding_rs",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# 面板搜索。调用 Everything 的官方命令行 es.exe，它的输出跟着控制台代码页走
# （中文系统上是 GBK），UTF-8 解不开时用它兜底，否则中文路径会变成替换字符。
encoding_rs = "0.8"

# 行情工具取数（东方财富的公开 JSON 接口）。
# TLS 走 **native-tls**，也就是 Windows 自带的 schannel，不引 rustls：
# 默认特性会把 aws-lc-rs 拉进来（一个要编 C 和汇编的大块头，构建慢、产物也大），
# 而本项目只发 Windows 包（.github/workflows/release.yml 只有 windows-latest），
# 用系统的 TLS 栈还能直接用 Windows 证书库——公司网里装了中间人代理也能通。
# http2 / system-proxy / charset 显式写出来：关掉 default-features 时不会自动带上，
# 少了它们这次改动就会悄悄改掉 updater 那边的 reqwest 行为（特性是全局合并的）。
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "charset",
    "http2",
    "system-proxy",
    "native-tls",
] }

# MCP server（--mcp 模式）。default 已含 server + macros，只需补 stdio transport。
rmcp = { version = "3.9", features = ["transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# 打开搜索结果用 ShellExecuteW：路径里的空格、引号、中文全交给系统处理，
# 不自己拼命令行（`cmd /c start` 会把第一个带引号的参数当成窗口标题）。
# 只用到几个导出函数，用 windows-sys 这种纯声明包，编译成本比 windows 低得多。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# 搜索结果的真实图标 / 缩略图。IShellItemImageFactory 只有 COM 接口，windows-sys
# 是纯声明包没有 vtable，所以这里用 windows（Tauri 本来就依赖它，不新增编译负担）。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
